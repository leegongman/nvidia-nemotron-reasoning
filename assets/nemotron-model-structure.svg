<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA Nemotron 3 Nano hybrid model structure and LoRA target surface</title>
  <desc id="desc">A schematic of the Nemotron hybrid Mamba2, GQA, and MoE backbone with the rank-32 LoRA modules used in this project.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#be185d"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 15px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .box { stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .main-line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .adapter-line { stroke: #be185d; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow-accent); }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="60" y="58" class="title">NVIDIA Nemotron 3 Nano: Model Structure and LoRA Surface</text>
  <text x="60" y="86" class="subtitle">Schematic view based on the public model card and the target modules inspected in this project.</text>

  <rect x="60" y="135" width="230" height="92" class="box" fill="#dbeafe"/>
  <text x="175" y="172" text-anchor="middle" class="label">Input</text>
  <text x="175" y="198" text-anchor="middle" class="body">prompt + chat template</text>

  <rect x="350" y="120" width="300" height="122" class="box" fill="#dcfce7"/>
  <text x="500" y="162" text-anchor="middle" class="label">Nemotron base model</text>
  <text x="500" y="190" text-anchor="middle" class="body">30B total / 3B active</text>
  <text x="500" y="215" text-anchor="middle" class="small">BF16 checkpoint</text>

  <path d="M290 181 H350" class="main-line"/>

  <rect x="720" y="120" width="330" height="122" class="box" fill="#fef3c7"/>
  <text x="885" y="162" text-anchor="middle" class="label">Hybrid backbone</text>
  <text x="885" y="190" text-anchor="middle" class="body">52 layers</text>
  <text x="885" y="215" text-anchor="middle" class="small">Mamba2 + GQA + MoE</text>
  <path d="M650 181 H720" class="main-line"/>

  <rect x="95" y="330" width="330" height="160" class="box" fill="#e0f2fe"/>
  <text x="260" y="370" text-anchor="middle" class="label">Mamba-2 blocks</text>
  <text x="260" y="402" text-anchor="middle" class="body">23 layers</text>
  <text x="260" y="435" text-anchor="middle" class="small">sequence mixing</text>
  <text x="260" y="460" text-anchor="middle" class="small">state-space processing</text>

  <rect x="535" y="330" width="330" height="160" class="box" fill="#ede9fe"/>
  <text x="700" y="370" text-anchor="middle" class="label">GQA / attention blocks</text>
  <text x="700" y="402" text-anchor="middle" class="body">6 layers</text>
  <text x="700" y="435" text-anchor="middle" class="small">2 query groups</text>
  <text x="700" y="460" text-anchor="middle" class="small">q/k/v/o projections</text>

  <rect x="975" y="330" width="330" height="160" class="box" fill="#ffedd5"/>
  <text x="1140" y="370" text-anchor="middle" class="label">MoE blocks</text>
  <text x="1140" y="402" text-anchor="middle" class="body">23 layers</text>
  <text x="1140" y="435" text-anchor="middle" class="small">128 routed + 1 shared expert</text>
  <text x="1140" y="460" text-anchor="middle" class="small">6 experts active per token</text>

  <path d="M885 242 V285 H260 V330" class="main-line"/>
  <path d="M885 242 V330 H700" class="main-line"/>
  <path d="M885 242 V285 H1140 V330" class="main-line"/>

  <rect x="505" y="585" width="390" height="96" class="box" fill="#e2e8f0"/>
  <text x="700" y="623" text-anchor="middle" class="label">Output projections + hidden states</text>
  <text x="700" y="651" text-anchor="middle" class="small">shared path after hybrid blocks</text>

  <path d="M260 490 V535 H700 V585" class="main-line"/>
  <path d="M700 490 V585" class="main-line"/>
  <path d="M1140 490 V535 H700 V585" class="main-line"/>

  <rect x="1030" y="585" width="275" height="96" class="box" fill="#dcfce7"/>
  <text x="1167" y="623" text-anchor="middle" class="label">lm_head</text>
  <text x="1167" y="651" text-anchor="middle" class="small">reasoning + boxed answer</text>
  <path d="M895 633 H1030" class="main-line"/>

  <rect x="60" y="585" width="350" height="160" class="box" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="235" y="622" text-anchor="middle" class="label">Rank-32 LoRA adapter</text>
  <text x="235" y="652" text-anchor="middle" class="body">project target surface</text>
  <text x="235" y="681" text-anchor="middle" class="small">q/k/v/o · up/down · in/out</text>
  <text x="235" y="707" text-anchor="middle" class="small">lm_head · expert weight tying</text>

  <path d="M410 665 H505" class="adapter-line"/>
  <path d="M410 635 C470 535 520 455 600 420" class="adapter-line"/>
  <path d="M410 700 C650 770 950 760 1167 681" class="adapter-line"/>

  <text x="60" y="790" class="small">Note: This is a project-level schematic, not a complete layer-by-layer implementation graph.</text>
</svg>
